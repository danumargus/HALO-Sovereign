<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Space Background -->
    <radialGradient id="obsidianBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#030509" />
    </radialGradient>

    <!-- Sovereign Gold Corona Gradient -->
    <linearGradient id="sovereignGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="28%" stop-color="#FDE68A" />
      <stop offset="62%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Cyber Cyan / Emerald Horizon Gradient -->
    <linearGradient id="quantumCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Inner Eclipse Void Gradient -->
    <radialGradient id="eclipseVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="78%" stop-color="#070C18" />
      <stop offset="100%" stop-color="#1E293B" />
    </radialGradient>

    <!-- Ambient Corona Glow Filter -->
    <filter id="coronaGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Square Badge Container -->
  <rect width="800" height="800" rx="140" fill="url(#obsidianBg)" />
  <rect x="18" y="18" width="764" height="764" rx="126" fill="none" stroke="#1E293B" stroke-width="2" />
  <rect x="24" y="24" width="752" height="752" rx="120" fill="none" stroke="url(#sovereignGold)" stroke-width="1.2" opacity="0.45" />

  <!-- Subtle Geometric Telemetry Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <circle cx="400" cy="340" r="260" fill="none" stroke-dasharray="3,9" />
    <circle cx="400" cy="340" r="225" fill="none" />
    <line x1="100" y1="340" x2="700" y2="340" opacity="0.35" />
    <line x1="400" y1="60" x2="400" y2="610" opacity="0.35" />
  </g>

  <!-- Central Emblem Group (Centered at 400, 340) -->
  <g transform="translate(400, 340)">
    <!-- Outer 16-Layer Closed-Loop Orbital Ring (16 Precision Nodes every 22.5 deg) -->
    <g stroke="url(#quantumCyan)" stroke-width="2.5" opacity="0.85">
      <line x1="0" y1="-225" x2="0" y2="-206" transform="rotate(0)" />
      <line x1="0" y1="-225" x2="0" y2="-210" transform="rotate(22.5)" />
      <line x1="0" y1="-225" x2="0" y2="-206" transform="rotate(45)" />
      <line x1="0" y1="-225" x2="0" y2="-210" transform="rotate(67.5)" />
      <line x1="0" y1="-225" x2="0" y2="-206" transform="rotate(90)" />
      <line x1="0" y1="-225" x2="0" y2="-210" transform="rotate(112.5)" />
      <line x1="0" y1="-225" x2="0" y2="-206" transform="rotate(135)" />
      <line x1="0" y1="-225" x2="0" y2="-210" transform="rotate(157.5)" />
      <line x1="0" y1="-225" x2="0" y2="-206" transform="rotate(180)" />
      <line x1="0" y1="-225" x2="0" y2="-210" transform="rotate(202.5)" />
      <line x1="0" y1="-225" x2="0" y2="-206" transform="rotate(225)" />
      <line x1="0" y1="-225" x2="0" y2="-210" transform="rotate(247.5)" />
      <line x1="0" y1="-225" x2="0" y2="-206" transform="rotate(270)" />
      <line x1="0" y1="-225" x2="0" y2="-210" transform="rotate(292.5)" />
      <line x1="0" y1="-225" x2="0" y2="-206" transform="rotate(315)" />
      <line x1="0" y1="-225" x2="0" y2="-210" transform="rotate(337.5)" />
    </g>

    <!-- Outer Sovereign Shield Arcs -->
    <path d="M -195 -112 A 225 225 0 0 1 195 -112" fill="none" stroke="url(#sovereignGold)" stroke-width="3" opacity="0.7" />
    <path d="M 195 112 A 225 225 0 0 1 -195 112" fill="none" stroke="url(#quantumCyan)" stroke-width="2.5" opacity="0.6" />

    <!-- The Primary HALO Eclipse Ring (Glowing Gold Corona) -->
    <circle cx="0" cy="0" r="168" fill="none" stroke="url(#sovereignGold)" stroke-width="14" filter="url(#coronaGlow)" />

    <!-- Offset Relativistic Photon Ring -->
    <ellipse cx="0" cy="0" rx="184" ry="154" transform="rotate(-28)" fill="none" stroke="url(#sovereignGold)" stroke-width="3.5" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="184" ry="154" transform="rotate(28)" fill="none" stroke="url(#quantumCyan)" stroke-width="2.2" opacity="0.75" />

    <!-- Inner Dark Eclipse Core -->
    <circle cx="0" cy="0" r="142" fill="url(#eclipseVoid)" stroke="#334155" stroke-width="1.5" />

    <!-- Sovereign Geometric Hex-Core Inside the Eclipse -->
    <polygon points="0,-96 83,-48 83,48 0,96 -83,48 -83,-48" fill="none" stroke="url(#sovereignGold)" stroke-width="3" opacity="0.9" />
    <polygon points="0,-68 59,-34 59,34 0,68 -59,34 -59,-34" fill="#0B1325" stroke="url(#quantumCyan)" stroke-width="2" />

    <!-- Inner Precision Axis Crosshair & Singularity Point -->
    <line x1="-59" y1="-34" x2="59" y2="34" stroke="#38BDF8" stroke-width="1.2" opacity="0.45" />
    <line x1="59" y1="-34" x2="-59" y2="34" stroke="#38BDF8" stroke-width="1.2" opacity="0.45" />
    <line x1="0" y1="-68" x2="0" y2="68" stroke="#FDE68A" stroke-width="1.2" opacity="0.45" />

    <!-- Central Sovereign Diamond Singularity -->
    <polygon points="0,-26 22,0 0,26 -22,0" fill="url(#sovereignGold)" filter="url(#subtleGlow)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />

    <!-- 6 Cardinal Vertex Nodes -->
    <circle cx="0" cy="-96" r="4.5" fill="#FDE68A" />
    <circle cx="83" cy="-48" r="4.5" fill="#38BDF8" />
    <circle cx="83" cy="48" r="4.5" fill="#10B981" />
    <circle cx="0" cy="96" r="4.5" fill="#FDE68A" />
    <circle cx="-83" cy="48" r="4.5" fill="#10B981" />
    <circle cx="-83" cy="-48" r="4.5" fill="#38BDF8" />
  </g>

  <!-- Wordmark Typography at Bottom -->
  <g transform="translate(400, 665)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#F8FAFC" letter-spacing="10">
      HALO
    </text>
    <text x="0" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="url(#sovereignGold)" letter-spacing="14">
      SOVEREIGN
    </text>
    <line x1="-140" y1="62" x2="140" y2="62" stroke="url(#quantumCyan)" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>
