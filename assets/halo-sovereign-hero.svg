    <rect x="392" y="46" width="102" height="90" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <text x="443" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34D399">
      VERIFIED
    </text>
    <text x="443" y="94" text-anchor="middle" font-family="monospace" font-size="10" fill="#E2E8F0">
