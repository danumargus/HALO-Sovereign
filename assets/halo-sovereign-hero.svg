      <ellipse cx="0" cy="0" rx="27" ry="20" transform="rotate(-28)" fill="none" stroke="#38BDF8" stroke-width="1.3" opacity="0.85" />
      <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="#0B1325" stroke="url(#goldGrad)" stroke-width="1.5" />
      <polygon points="0,-6 5,0 0,6 -5,0" fill="#FDE68A" />
    </g>

    <text x="68" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#F8FAFC" letter-spacing="2">
      HALO <tspan fill="url(#goldGrad)">SOVEREIGN</tspan>
    </text>
    <text x="68" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#94A3B8" letter-spacing="1.2">
